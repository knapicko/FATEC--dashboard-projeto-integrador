# Configuração mínima da Supabase CLI para publicar as Edge Functions deste projeto.
# Publicar:  npx supabase functions deploy admin-contas --project-ref woqhicdlnkoksypipyoz
project_id = "consertaja-dashboard"

[functions.admin-contas]
verify_jwt = true

# Publicar:  npx supabase functions deploy admin-consultas --project-ref woqhicdlnkoksypipyoz
# Requer o segredo SUPABASE_ACCESS_TOKEN (token pessoal do Supabase).
[functions.admin-consultas]
verify_jwt = true
