# Publica o site + dashboard no GitHub Pages a cada push na branch main.
# Ativar uma única vez: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Valores públicos do Supabase do ConsertaJá (mesmos do app).
      # Para trocar, crie variáveis com estes nomes em Settings > Secrets and variables > Actions > Variables.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://woqhicdlnkoksypipyoz.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_RFFTWcp3nJ8vEG0hACjwfA_b2thYfaw' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci || npm install --legacy-peer-deps

      - name: Build (site + dashboard)
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
